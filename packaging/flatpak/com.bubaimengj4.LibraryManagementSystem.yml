app-id: com.bubaimengj4.LibraryManagementSystem
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: LibraryManagementSystem
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.secrets
modules:
  - name: library-management-system
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
    sources:
      - type: dir
        path: ../..
